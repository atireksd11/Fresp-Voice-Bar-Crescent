<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Visualizer</title>
    <link rel="stylesheet" href="style.css">    
    <script src="script.js" defer></script>
</head>
<body>
    <main class="player">
        <h1>Music Visualizer</h1>
        <p class="subtitle">Choose a song and watch its frequencies move.</p>

        <label class="file-picker" for="audio-file">Choose an audio file:</label>
        <input id="audio-file" type="file" accept="audio/*">

        <audio id="audio-player" controls></audio>
        <p id="status" role="status" accept="audio/*"></p>

        <canvas id="visualizer" aria-label="Audio frequency visualizer"></canvas>
    </main>
</body>
</html>
