<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Sketchbook</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="player">
        <nav class="site-nav" aria-label="Main navigation">
            <a href="index.html" aria-current="page">Visualizer</a>
            <a href="about.html">About</a>
        </nav>
        <p class="eyebrow">A little sound experiment</p>
        <h1>Sound Sketchbook <span aria-hidden="true">♪</span></h1>
        <p class="subtitle">Pick a song and see what it looks like.</p>

        <label class="file-picker" for="audio-file">Choose an audio file</label>
        <input id="audio-file" type="file" accept="audio/*">

        <audio id="audio-player" controls hidden></audio>
        <p id="status" role="status">Choose a song to begin.</p>

        <section class="visualizer-section" aria-label="Music visualizer">
            <p class="section-label">Sound drawing <span aria-hidden="true">✳</span></p>
            <canvas id="visualizer" aria-label="Bars showing the song's frequencies"></canvas>
        </section>

        <footer>Made for listening, experimenting, and learning.</footer>
    </main>
</body>
</html>
